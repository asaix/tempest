name: release

on:
  push:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CC=gcc-14

      - name: Package
        run: |
          mkdir tempest-linux-x86_64
          cp tempest install.sh README.md LICENSE tempest-linux-x86_64/
          tar -czf tempest-linux-x86_64.tar.gz tempest-linux-x86_64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "tempest-${GITHUB_SHA::7}" tempest-linux-x86_64.tar.gz --target "$GITHUB_SHA" --generate-notes
